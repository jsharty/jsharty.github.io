{%- comment -%} Search box + research-pillar filter chips for a list page. {%- endcomment -%}
<div class="filters" role="search">
  <label class="sr-only" for="q">Search this page</label>
  <div class="searchbox">
    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
    <input id="q" type="search" placeholder="Search {{ include.what | default: 'this page' }} (title, coauthor, venue, year)" autocomplete="off">
  </div>
  <div class="chips" role="group" aria-label="Filter by research pillar">
    <button type="button" class="chip" data-pillar="" aria-pressed="true">All</button>
    {% for p in site.data.pillars.order %}
    <button type="button" class="chip chip-{{ p }}" data-pillar="{{ p }}" aria-pressed="false">{{ site.data.pillars.labels[p] }}</button>
    {% endfor %}
  </div>
  {%- if include.sort -%}
  <div class="sortbox">
    <label for="sort">Sort by</label>
    <select id="sort">
      <option value="cv">CV order (by section)</option>
      <option value="new">Year, newest first</option>
      <option value="old">Year, oldest first</option>
      <option value="author">First author, A to Z</option>
      <option value="venue">{{ include.venue_label | default: "Journal or venue" }}, A to Z</option>
      <option value="title">Title, A to Z</option>
      <option value="role">My role (first-authored first)</option>
    </select>
  </div>
  {%- endif -%}
  <p class="count" aria-live="polite"></p>
</div>
