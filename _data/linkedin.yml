  - date: 2026-11-10
    url: https://www.linkedin.com/feed/update/urn:li:activity:7525962600300449792/
    text: "The 2029 CSWE EPAS draft removes anti-racism from social work's accreditation standards, and no law required it to. Grateful to publish this invited commentary with Bethany Jo Murray and Bianca Schindeler in the new issue of Abolitionist Perspectives in Social Work: \"An Unaccountable Education: The 2029 CSWE EPAS and the Politics of Anticipatory Compliance.\""
  - date: 2026-10-29
    url: https://www.linkedin.com/feed/update/urn:li:activity:7521660528146952192/
    text: "To social work students: in 2020, when I was trying to make sense of the events surrounding our last reckoning, I created a guide on Black contributions to mutual aid, social welfare, and social work history. In that same spirit, I offer you this bibliography: Critical Histories of Social Work: An Annotated Bibliography (Version 1) gathers 205 books, articles, and chapters that critique our profession and its organizations."
  - date: 2026-10-19
    url: https://www.linkedin.com/feed/update/urn:li:activity:7517966404369891328/
    text: "\"We have too often a deliberate attempt to change the facts of history that the story will make pleasant reading for Americans.\" (W.E.B. Du Bois, 1935). Last week I posted about CSWE's 2029 EPAS draft stripping out anti-racism and oppression. There is a quieter loss in that draft: our own history."
  - date: 2026-10-15
    url: https://www.linkedin.com/feed/update/urn:li:activity:7516515912750137344/
    text: "Is the 2029 EPAS our new loyalty oath? The first draft strips out the 2022 anti-racism, diversity, equity, and inclusion framework. Words are how a profession tells the truth about itself. Erase them and you erase what we are accountable for."
